profile:
  name: {uk: "Юрій Заїка", en: "Yurii Zaika"}
  location: {uk: "Дніпро, Україна · віддалено або гібрид", en: "Dnipro, Ukraine · remote or hybrid"}
  titles:
    full: {uk: "Провідний інженер ПЗ · .NET та Delphi", en: "Lead Software Engineer · .NET & Delphi"}
    dotnet: {uk: "Senior .NET інженер", en: "Senior .NET Engineer"}
    delphi: {uk: "Senior Delphi інженер · модернізація legacy", en: "Senior Delphi Engineer · Legacy Modernization"}
    web: {uk: "Full Stack інженер · .NET, Angular та React", en: "Full Stack Engineer · .NET, Angular & React"}
    ai: {uk: "AI / Python інженер", en: "AI / Python Engineer"}
  summary:
    full:
      uk: "Десять років усередині ядра АТБ-Маркет, найбільшої продуктової мережі України: сервіси на ASP.NET Core, що поступово забирають функції торгової системи на Delphi, якою щодня працюють магазини. Доступи для 2000+ користувачів, фіскальні та EDI-інтеграції, міграція клієнта з Delphi 6 на Delphi 12/13."
      en: "Ten years inside the core systems of ATB-Market, Ukraine's largest grocery retail network: ASP.NET Core services that keep taking over functions from the Delphi trading platform the stores run on daily. Access control for 2,000+ users, fiscal and EDI integrations, and an ongoing Delphi 6 to Delphi 12/13 client migration."
    dotnet:
      uk: "Senior .NET інженер: ASP.NET Core та Web API, EF Core і T-SQL, інтеграції з EDI, Kafka та Oracle EBS, аутентифікація через OIDC, ADFS і Kerberos. Власна система керування доступом на 2000+ користувачів."
      en: "Senior .NET engineer: ASP.NET Core and Web API, EF Core and T-SQL, integrations over EDI, Kafka and Oracle EBS, authentication through OIDC, ADFS and Kerberos. Built the in-house access management system used by 2,000+ people."
    delphi:
      uk: "Delphi-інженер, десять років відповідаю за клієнтську частину торгової системи найбільшої продуктової мережі України: десктопний VCL-застосунок, у якому щодня працюють магазини, MS SQL, фіскальний контур. Веду міграцію клієнта з Delphi 6 на Delphi 12/13 і написав інструмент звіряння інтерфейсу та мапінгу БД між версіями."
      en: "Delphi engineer, ten years owning the client side of the trading system at Ukraine's largest grocery network: the VCL desktop application its stores run on daily, MS SQL, the fiscal workflows. Currently migrating it from Delphi 6 to Delphi 12/13 with a purpose-built tool that diffs UI and database mappings between versions."
    web:
      uk: "Full stack інженер: ASP.NET Core та Web API на бекенді, Angular (Kendo UI) і React / Next.js на фронті, real-time через SignalR. Внутрішні системи для роздрібної мережі — доступи, аудит, звітність, інтеграції."
      en: "Full stack engineer: ASP.NET Core and Web API on the back end, Angular (Kendo UI) and React / Next.js on the front, real-time over SignalR. Internal systems for a retail network: access control, audit, reporting, integrations."
    ai:
      uk: "Десять років промислової розробки — тепер у Python та ML. Побудував голосовий пайплайн реального часу: faster-whisper на CUDA, діаризація pyannote, VAD і потокова обробка, з регресійними замірами затримки та real-time factor (RTF). Поряд — інструменти для LLM-агентів (MCP-сервери, власні субагенти, CDP-інспектор браузера) і конвеєри даних на SQLAlchemy та Playwright."
      en: "Ten years of production engineering, now applied to Python and ML. Built a real-time speech pipeline: faster-whisper on CUDA, pyannote diarization, VAD and streaming, with regression measurements of latency and real-time factor (RTF). Alongside it: tooling for LLM agents (MCP servers, custom subagents, a CDP browser inspector) and data pipelines on SQLAlchemy and Playwright."
