achievements:
  - text:
      uk: "Побудував UAM — власну систему керування доступом мережі: 2000+ користувачів, OpenID Connect, ADFS і Kerberos замість ручної роздачі прав по кожній системі окремо."
      en: "Built UAM, the network's in-house access management system: 2,000+ users on OpenID Connect, ADFS and Kerberos, replacing per-system manual permission handling."
    primary: [dotnet, web, full]
    tags: [full, dotnet, web, authentication, authorization, access-management, enterprise]
  - text:
      uk: "Веду міграцію клієнта торгової системи з Delphi 6 на Delphi 12/13 і написав інструмент, що звіряє інтерфейс і мапінг БД між версіями — щоб перехід не ламав продакшен магазинів."
      en: "Leading the trading system client migration from Delphi 6 to Delphi 12/13, with a purpose-built tool that diffs UI and database mappings between versions so the switch does not break store operations."
    primary: [delphi, full]
    tags: [full, delphi, desktop, legacy, modernization]
  - text:
      uk: "Спроєктував і побудував платформу SMS-сповіщень мережі: SMPP і GSM API, .NET Web API та MS SQL, з архітектурою під пікові розсилки."
      en: "Architected and built the network's SMS notification platform: SMPP and GSM API, .NET Web API and MS SQL, designed for peak-volume campaigns."
    primary: [dotnet]
    tags: [full, dotnet, web, integration, messaging]
  - text:
      uk: "Проводжу зміни фіскального законодавства наскрізь по системах: еАкциз і АЕД, УКТЗЕД, митні спрощення, нові ставки ПДВ — у працюючій мережі, без зупинки магазинів."
      en: "Deliver fiscal-law changes end to end across the systems: excise stamps and AED, UKTZED codes, customs simplifications, new VAT rates, all in a live retail network without stopping the stores."
    primary: [delphi]
    tags: [full, dotnet, delphi, retail, enterprise]
  - text:
      uk: "Побудував внутрішні веб-системи для магазинів: журнали та аудит, вторсировина з інтеграцією в M.E.Doc, портал підтримки, купони, звітність."
      en: "Built the internal web systems stores work with: journals and audit, recyclables with M.E.Doc integration, a support portal, coupons and reporting."
    primary: [dotnet, web]
    tags: [full, dotnet, web, retail, reporting, warehouse, enterprise, fullstack]
  - text:
      uk: "Побудував голосовий пайплайн реального часу на Python: faster-whisper на GPU, діаризація pyannote, VAD, потоковий захват."
      en: "Built a real-time speech pipeline in Python: faster-whisper on GPU, pyannote diarization, VAD and streaming capture."
    primary: [ai]
    tags: [ai, python, data]
  - text:
      uk: "Зробив для нього регресійні заміри якості — RTF, затримка, стійкість до шуму, межі точності — і веду рішення за цифрами, а не на слух."
      en: "Wrote its quality regression suite — RTF, latency, noise robustness, accuracy ceilings — and drive decisions from the numbers rather than impressions."
    primary: [ai]
    tags: [ai, python]
  - text:
      uk: "Зібрав конвеєри даних на Python: SQLAlchemy 2 і Alembic поверх PostgreSQL, Playwright для захищених сторінок, шість джерел оголошень в одному каталозі."
      en: "Built Python data pipelines: SQLAlchemy 2 and Alembic over PostgreSQL, Playwright for protected pages, six listing sources merged into one catalog."
    primary: [ai]
    tags: [ai, python, data]
